<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANUTARANG 2026</title>
    <style>
        /* Sets a clean background color for the rest of the page */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #f0f0f0; 
        }

        body {
            /* REPLACE 'your-image.jpg' WITH YOUR IMAGE PATH OR URL */
            background-image: url('2026.jpg');
            
            /* Keeps the image perfectly centered horizontally and vertically */
            background-position: center center;
            
            /* Prevents the image from repeating */
            background-repeat: no-repeat;
            
            /* Forces the image to lock in place so it stays fixed */
            background-attachment: fixed;
            
            /* Scales the image size to exactly 70% of the viewport width (vw) and height (vh) */
            background-size: 90vw 85vh;
        }
    </style>
</head>
<body>

</html>
